spring:
  application:
    name: backend

  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/membershield}"
    username: "${DATABASE_USERNAME:membershield}"
    password: "${DATABASE_PASSWORD:membershield}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true